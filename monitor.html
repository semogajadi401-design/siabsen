<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dashboard Pengawasan Kepala Sekolah</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue-dark:#0D47A1;--blue:#1976D2;--gold:#FFD700;
  --bg:#0a1f38;--surface:#fff;--text:#1a1a1a;--text-muted:#777;--border:#eee;
  --success:#2E7D32;--warning:#F57F17;--danger:#C62828;
  --font:'Segoe UI',system-ui,Arial,sans-serif;
}
html,body{height:100%}
body{
  font-family:var(--font);min-height:100vh;min-height:100dvh;
  background:
    radial-gradient(circle at 15% 0%, rgba(25,118,210,.35), transparent 55%),
    radial-gradient(circle at 90% 100%, rgba(255,215,0,.18), transparent 55%),
    var(--bg);
  color:var(--text);padding:16px;display:flex;justify-content:center;
}
.wrap{width:100%;max-width:760px}

.state-box{
  width:100%;max-width:420px;margin:10vh auto 0;
  background:var(--surface);border-radius:16px;padding:36px 24px;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}
.spinner{width:40px;height:40px;border:4px solid #e5e5e5;border-top-color:var(--blue);border-radius:50%;
  margin:0 auto 16px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.state-box h3{font-size:1rem;margin-bottom:6px}
.state-box p{font-size:.85rem;color:var(--text-muted);line-height:1.5}
.state-box .emoji{font-size:2.2rem;margin-bottom:10px}

.card{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.45);
  animation:popIn .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

.header{background:linear-gradient(120deg,var(--blue-dark) 0%,var(--blue) 70%,#0D47A1 100%);
  padding:16px 20px;color:#fff}
.header .tag{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);
  color:var(--gold);font-size:.62rem;font-weight:700;letter-spacing:.4px;padding:2px 8px;border-radius:20px;
  text-transform:uppercase;margin-bottom:6px}
.header h1{font-size:1.1rem;font-weight:800}
.header .sub{font-size:.78rem;color:rgba(255,255,255,.9);margin-top:2px}

.tabs{display:flex;gap:6px;padding:12px 16px 0;background:#f4f7fb;overflow-x:auto}
.tab-btn{flex-shrink:0;padding:8px 14px;border-radius:9px 9px 0 0;border:none;cursor:pointer;
  font-size:.78rem;font-weight:700;background:transparent;color:var(--text-muted)}
.tab-btn.active{background:var(--surface);color:var(--blue-dark)}

.content{padding:16px 18px 20px;background:var(--surface)}
.section{margin-bottom:18px}
.section:last-child{margin-bottom:0}
.section-title{font-size:.72rem;font-weight:800;color:var(--blue-dark);text-transform:uppercase;
  letter-spacing:.4px;margin-bottom:8px;display:flex;align-items:center;gap:6px}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
@media(max-width:480px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat-box{background:#f4f7fb;border-radius:10px;padding:10px 6px;text-align:center;border:1px solid #e5ecf4}
.stat-box .n{font-size:1.15rem;font-weight:800;color:var(--blue-dark)}
.stat-box .l{font-size:.62rem;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.2px}
.stat-box.success .n{color:var(--success)}
.stat-box.warning .n{color:var(--warning)}
.stat-box.danger .n{color:var(--danger)}

.pct-bar-wrap{background:#eee;border-radius:20px;height:8px;overflow:hidden;margin-top:8px}
.pct-bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--success))}

.list-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.avatar{width:34px;height:34px;border-radius:9px;background:#eef5fd;color:var(--blue-dark);
  display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:.85rem}
.li-main{flex:1;min-width:0}
.li-name{font-weight:600;font-size:.85rem}
.li-sub{font-size:.72rem;color:var(--text-muted)}
.badge{font-size:.65rem;font-weight:700;padding:3px 8px;border-radius:20px;flex-shrink:0}
.badge-success{background:#e8f5e9;color:var(--success)}
.badge-warning{background:#fff8e1;color:var(--warning)}
.badge-danger{background:#ffebee;color:var(--danger)}
.badge-info{background:#e3f2fd;color:var(--blue-dark)}
.badge-gray{background:#f0f0f0;color:#777}

.empty{font-size:.8rem;color:var(--text-muted);padding:10px 0;text-align:center}

.footer-note{padding:12px 18px;background:#f4f7fb;font-size:.68rem;color:var(--text-muted);text-align:center;line-height:1.5}
.btn-refresh{margin-top:14px;width:100%;padding:11px;border-radius:10px;border:none;background:var(--blue-dark);
  color:#fff;font-weight:700;font-size:.85rem;cursor:pointer}
.btn-close{
  display:block;width:100%;margin-top:10px;padding:11px;border-radius:10px;border:1.5px solid #ddd;
  background:#fff;color:#555;font-weight:700;font-size:.82rem;cursor:pointer;
}
.btn-close:active{transform:scale(.97)}

.health-note{font-size:.72rem;color:var(--text-muted);line-height:1.55;margin-bottom:10px}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 13px;border-radius:20px;border:1.5px solid #ddd;background:#fff;
  font-size:.72rem;font-weight:700;cursor:pointer;color:var(--text-muted)}
.chip.active{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff}
.chip:active{transform:scale(.96)}
.health-subtitle{font-size:.72rem;font-weight:700;color:var(--blue-dark);margin:14px 0 6px}
.health-disclaimer{margin-top:10px;font-size:.65rem;color:var(--text-muted);line-height:1.55;
  background:#f4f7fb;border-radius:8px;padding:9px 11px}
.chart-legend{font-size:.6rem;color:var(--text-muted);margin-top:4px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="state-box">
    <div class="spinner"></div>
    <h3>Memuat dashboard sekolah...</h3>
    <p>Mengambil data terbaru, mohon tunggu sebentar.</p>
  </div>
</div>

<script>
function esc(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
const API_BASE = window.location.origin;
const API_TIMEOUT_MS = 8000;

async function api(action, params = {}) {
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    return { success: false, message: 'Tidak ada koneksi internet. Dashboard ini butuh koneksi internet untuk dimuat.' };
  }
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), API_TIMEOUT_MS);
  let res;
  try {
    res = await fetch(`${API_BASE}/api/monitor`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, ...params }), signal: controller.signal
    });
  } catch (e) {
    clearTimeout(timer);
    if (e.name === 'AbortError') return { success: false, message: 'Koneksi terlalu lambat. Coba refresh lagi.' };
    return { success: false, message: 'Gagal terhubung ke server. Pastikan HP terhubung ke internet.' };
  }
  clearTimeout(timer);
  if (!res.ok) return { success: false, message: `Server error (status ${res.status})` };
  try { return await res.json(); } catch (e) { return { success: false, message: 'Respons server tidak valid.' }; }
}

// Dukung /monitor?t=TOKEN dan /monitor/TOKEN
const qp = new URLSearchParams(window.location.search);
const pathMatch = window.location.pathname.match(/\/monitor\/([^/?#]+)/i);
const TOKEN = qp.get('t') || qp.get('token') || (pathMatch ? pathMatch[1] : '') || '';

let INFO = null;
let currentTab = 'hari';

// Tombol "Tutup dan kembali ke halaman scan" — sama pola dengan
// riwayat.html, supaya kalau halaman ini dibuka dari kiosk scan.html
// (mis. QR kartu kepsek kepencet discan di tablet piket), ada jalan
// jelas untuk kembali ke mode scan tanpa perlu tombol back browser.
function tombolTutupHTML() {
  return `<button class="btn-close" onclick="tutupDanKembaliKeScan()">✖ Tutup dan kembali ke halaman scan</button>`;
}
function tutupDanKembaliKeScan() {
  // Sama seperti riwayat.html: halaman ini dibuka sebagai iframe di
  // dalam scan.html (overlayEksternal), jadi cukup panggil fungsi tutup
  // milik parent -- tidak ada reload/reinit sama sekali.
  if (window.parent && window.parent !== window && typeof window.parent.tutupOverlayEksternal === 'function') {
    window.parent.tutupOverlayEksternal();
    return;
  }
  window.location.href = window.location.origin + '/scan';
}

function renderState(emoji, title, msg) {
  document.getElementById('app').innerHTML = `
    <div class="state-box">
      <div class="emoji">${emoji}</div>
      <h3>${esc(title)}</h3>
      <p>${esc(msg)}</p>
      ${tombolTutupHTML()}
    </div>`;
}

function statBox(n, l, cls) {
  return `<div class="stat-box ${cls||''}"><div class="n">${n}</div><div class="l">${esc(l)}</div></div>`;
}

async function init() {
  if (!TOKEN) { renderState('❌', 'QR tidak valid', 'Kode QR ini tidak berisi token yang bisa dibaca.'); return; }
  const info = await api('getInfo', { token: TOKEN });
  if (!info.success) { renderState('⛔', 'Tidak bisa membuka dashboard', info.message); return; }
  INFO = info;
  renderShell();
  loadTab('hari');
}

function renderShell() {
  document.getElementById('app').innerHTML = `
    <div class="card">
      <div class="header">
        <div class="tag">👑 Dashboard Kepala Sekolah</div>
        <h1>${esc(INFO.namaSekolah)}</h1>
        <div class="sub">Halo, ${esc(INFO.kepsek.nama)} — ringkasan keadaan sekolah saat ini</div>
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="tabbtn-hari" onclick="loadTab('hari')">📍 Hari Ini</button>
        <button class="tab-btn" id="tabbtn-minggu" onclick="loadTab('minggu')">📅 7 Hari Terakhir</button>
        <button class="tab-btn" id="tabbtn-bulan" onclick="loadTab('bulan')">🗓️ Bulan Ini</button>
        <button class="tab-btn" id="tabbtn-sistem" onclick="loadTab('sistem')">🩺 Sistem</button>
      </div>
      <div class="content" id="tabContent">
        <div class="empty">Memuat...</div>
      </div>
      <div class="footer-note">
        Data diperbarui langsung dari server. Halaman ini hanya bisa dibuka lewat QR kartu Kepala Sekolah.
      </div>
      <div style="padding:0 18px 18px">
        ${tombolTutupHTML()}
      </div>
    </div>`;
}

function setActiveTabBtn(tab) {
  ['hari','minggu','bulan','sistem'].forEach(t => {
    document.getElementById('tabbtn-' + t).classList.toggle('active', t === tab);
  });
}

async function loadTab(tab) {
  currentTab = tab;
  setActiveTabBtn(tab);
  const el = document.getElementById('tabContent');

  if (tab === 'sistem') {
    // BEDA dari tab lain: TIDAK memanggil api() apapun begitu tab dibuka.
    // Panel ini hanya menampilkan filter chip -- pengecekan baru berjalan
    // kalau salah satu chip ditekan (lihat cekKesehatan()).
    el.innerHTML = renderPanelKesehatanSistem();
    return;
  }

  el.innerHTML = `<div class="empty">⏳ Memuat data...</div>`;
  if (tab === 'hari') {
    const d = await api('getLiveHariIni', { token: TOKEN });
    if (!d.success) { el.innerHTML = `<div class="empty">❌ ${esc(d.message)}</div>`; return; }
    el.innerHTML = renderHariIni(d);
  } else {
    const d = await api('getRekapPeriode', { token: TOKEN, rentang: tab });
    if (!d.success) { el.innerHTML = `<div class="empty">❌ ${esc(d.message)}</div>`; return; }
    el.innerHTML = renderRekapPeriode(d);
  }
}

function renderHariIni(d) {
  if (!d.hariSekolah) {
    return `<div class="empty">😴 Hari ini (${esc(d.hari)}) bukan hari sekolah${d.keteranganLibur ? ' — ' + esc(d.keteranganLibur) : ''}.</div>`;
  }
  const k = d.kehadiranSiswa;
  const m = d.mengajar;

  const sakitIzinHTML = k.daftarSakitIzin.length
    ? k.daftarSakitIzin.map(s => `
      <div class="list-item">
        <div class="avatar">${esc((s.nama||'?').charAt(0))}</div>
        <div class="li-main">
          <div class="li-name">${esc(s.nama)}</div>
          <div class="li-sub">${esc(s.kelas)}${s.keterangan ? ' • ' + esc(s.keterangan) : ''}</div>
        </div>
        <span class="badge ${s.status==='Sakit'?'badge-warning':'badge-info'}">${esc(s.status)}</span>
      </div>`).join('')
    : `<div class="empty">Tidak ada siswa sakit/izin tercatat hari ini.</div>`;

  const piketHTML = d.piket.length
    ? d.piket.map(p => `
      <div class="list-item">
        <div class="avatar">${esc((p.namaGuru||'?').charAt(0))}</div>
        <div class="li-main">
          <div class="li-name">${esc(p.namaGuru)}</div>
          <div class="li-sub">${esc(p.jabatan||'-')}${p.jamLapor ? ' • lapor ' + esc(p.jamLapor) : ''}</div>
        </div>
        <span class="badge ${p.sudahLapor?'badge-success':'badge-danger'}">${p.sudahLapor?'✅ Sudah Lapor':'⛔ Belum Lapor'}</span>
      </div>`).join('')
    : `<div class="empty">Tidak ada jadwal piket hari ini.</div>`;

  const mengajarSection = (title, arr, renderer, emptyMsg) => `
    <div class="section-title" style="margin-top:14px">${title} (${arr.length})</div>
    ${arr.length ? arr.map(renderer).join('') : `<div class="empty">${emptyMsg}</div>`}
  `;

  return `
    <div class="section">
      <div class="section-title">📊 Kehadiran Siswa Hari Ini</div>
      <div class="stat-grid">
        ${statBox(k.hadir, 'Hadir', 'success')}
        ${statBox(k.terlambat, 'Terlambat', 'warning')}
        ${statBox(k.sakit + k.izin, 'Sakit/Izin', '')}
        ${statBox(k.alpha, 'Tanpa Keterangan', 'danger')}
      </div>
      <div style="font-size:.72rem;color:var(--text-muted)">dari total ${k.totalSiswa} siswa aktif</div>
    </div>

    <div class="section">
      <div class="section-title">🤒 Siswa Sakit / Izin Hari Ini</div>
      ${sakitIzinHTML}
    </div>

    <div class="section">
      <div class="section-title">🪪 Guru Piket Hari Ini</div>
      ${piketHTML}
    </div>

    <div class="section">
      <div class="section-title">📚 Status Mengajar Guru (Real-time, jam ${esc(d.jamSekarang)})</div>
      ${mengajarSection('🟢 Sedang Mengajar', m.sedangMengajar, g => `
        <div class="list-item">
          <div class="avatar">${esc((g.namaGuru||'?').charAt(0))}</div>
          <div class="li-main"><div class="li-name">${esc(g.namaGuru)}</div>
            <div class="li-sub">${esc(g.mapel)} • ${esc(g.kelas)}</div></div>
          <span class="badge ${g.tercatatAbsen?'badge-success':'badge-warning'}">${g.tercatatAbsen?'Absen ✓':'Belum Absen'}</span>
        </div>`, 'Tidak ada guru yang sedang mengajar saat ini.')}
      ${mengajarSection('✅ Sudah Selesai Mengajar', m.sudahSelesai, g => `
        <div class="list-item">
          <div class="avatar">${esc((g.namaGuru||'?').charAt(0))}</div>
          <div class="li-main"><div class="li-name">${esc(g.namaGuru)}</div>
            <div class="li-sub">${g.totalSesi} sesi hari ini</div></div>
          ${g.adaYangTidakTercatat ? '<span class="badge badge-warning">Ada sesi tak tercatat</span>' : '<span class="badge badge-success">Lengkap</span>'}
        </div>`, 'Belum ada guru yang menyelesaikan jadwal mengajarnya.')}
      ${mengajarSection('⏳ Belum Mulai Mengajar', m.belumMulai, g => `
        <div class="list-item">
          <div class="avatar">${esc((g.namaGuru||'?').charAt(0))}</div>
          <div class="li-main"><div class="li-name">${esc(g.namaGuru)}</div>
            <div class="li-sub">${esc(g.mapel)} • ${esc(g.kelas)} — mulai ${esc(g.jamMulai)}</div></div>
        </div>`, 'Tidak ada guru yang masih menunggu jadwalnya.')}
    </div>
    <button class="btn-refresh" onclick="loadTab('hari')">🔄 Refresh</button>
  `;
}

function renderRekapPeriode(d) {
  const k = d.kehadiranSiswa;
  const labelRentang = d.rentang === 'minggu' ? '7 Hari Terakhir' : 'Bulan Ini';

  const piketHTML = d.kepatuhanPiket.length
    ? d.kepatuhanPiket.map(g => `
      <div class="list-item">
        <div class="avatar">${esc((g.namaGuru||'?').charAt(0))}</div>
        <div class="li-main">
          <div class="li-name">${esc(g.namaGuru)}</div>
          <div class="li-sub">Tepat: ${g.hadirTepat} • Digantikan: ${g.digantikan} • Tanpa Piket: ${g.tanpaPiket}</div>
        </div>
        ${g.tanpaPiket > 0
          ? `<span class="badge badge-danger">⚠️ ${g.tanpaPiket}x bolong</span>`
          : `<span class="badge badge-success">✅ Patuh</span>`}
      </div>`).join('')
    : `<div class="empty">Belum ada jadwal piket yang diatur.</div>`;

  return `
    <div class="section">
      <div class="section-title">📊 Rekap Kehadiran Siswa — ${esc(labelRentang)}</div>
      <div style="font-size:.72rem;color:var(--text-muted);margin-bottom:8px">${esc(d.tanggalMulai)} s/d ${esc(d.tanggalSelesai)} (${d.jumlahHariSekolah} hari sekolah)</div>
      <div class="stat-grid">
        ${statBox(k.hadir, 'Hadir', 'success')}
        ${statBox(k.terlambat, 'Terlambat', 'warning')}
        ${statBox(k.sakit + k.izin, 'Sakit/Izin', '')}
        ${statBox(k.alpha, 'Tanpa Keterangan', 'danger')}
      </div>
      <div class="pct-bar-wrap"><div class="pct-bar" style="width:${k.persentaseKehadiran}%"></div></div>
      <div style="font-size:.72rem;color:var(--text-muted);margin-top:4px">Persentase kehadiran: <b>${k.persentaseKehadiran}%</b></div>
    </div>

    <div class="section">
      <div class="section-title">🪪 Kepatuhan Piket Guru — ${esc(labelRentang)}</div>
      ${piketHTML}
    </div>
    <button class="btn-refresh" onclick="loadTab('${d.rentang}')">🔄 Refresh</button>
  `;
}

// ═══════════════ CEK KESEHATAN SISTEM (BARU, khusus kepsek) ═══════════════
function renderPanelKesehatanSistem() {
  return `
    <div class="section">
      <div class="section-title">🩺 Cek Kesehatan Sistem</div>
      <div class="health-note">
        Untuk memverifikasi klaim "kendala sistem/tidak bisa buka aplikasi" dari guru piket.
        Pilih rentang waktu, lalu tekan salah satu tombol di bawah — pengecekan baru berjalan
        setelah ditekan, tidak otomatis.
      </div>
      <div class="filter-chips" id="healthFilters">
        <button class="chip" data-r="jam" onclick="cekKesehatan('jam')">🕐 6 Jam Terakhir</button>
        <button class="chip" data-r="hari" onclick="cekKesehatan('hari')">📍 Hari Ini</button>
        <button class="chip" data-r="minggu" onclick="cekKesehatan('minggu')">📅 Minggu</button>
        <button class="chip" data-r="bulan" onclick="cekKesehatan('bulan')">🗓️ Bulan</button>
        <button class="chip" data-r="semester" onclick="cekKesehatan('semester')">🎓 Semester</button>
      </div>
      <div id="healthResult"></div>
    </div>
  `;
}

let healthLoading = false;
async function cekKesehatan(rentang) {
  if (healthLoading) return;
  healthLoading = true;
  document.querySelectorAll('#healthFilters .chip').forEach(b => b.classList.toggle('active', b.dataset.r === rentang));
  const el = document.getElementById('healthResult');
  if (!el) { healthLoading = false; return; }
  el.innerHTML = `<div class="empty">⏳ Mengecek riwayat kiosk & status layanan eksternal (Vercel/Supabase)...</div>`;
  const d = await api('cekKesehatanSistem', { token: TOKEN, rentang });
  healthLoading = false;
  if (!d.success) { el.innerHTML = `<div class="empty">❌ ${esc(d.message)}</div>`; return; }
  el.innerHTML = renderHasilKesehatan(d);
}

function renderHasilKesehatan(d) {
  const r = d.ringkasan;
  return `
    <div class="stat-grid">
      ${statBox(r.totalHeartbeat, 'Heartbeat Tercatat', '')}
      ${statBox(r.totalPerangkat, 'Perangkat', '')}
      ${statBox(r.totalGangguanTerdeteksi, 'Celah Terdeteksi', r.totalGangguanTerdeteksi > 0 ? 'warning' : 'success')}
      ${statBox(r.totalInsidenEksternal, 'Insiden Resmi', r.totalInsidenEksternal > 0 ? 'danger' : 'success')}
    </div>

    <div class="health-subtitle">📈 Aktivitas Kiosk dari Waktu ke Waktu</div>
    ${buatGrafikSVG(d.timeline)}

    <div class="health-subtitle">⚠️ Celah Waktu Mencurigakan (indikasi kiosk offline/gangguan)</div>
    ${renderGangguan(d.gangguanTerdeteksi)}

    <div class="health-subtitle">☁️ Insiden Resmi Vercel / Supabase pada Rentang Ini</div>
    ${renderInsiden(d.insidenEksternal)}

    <div class="health-disclaimer">
      ℹ️ Ini <b>indikasi</b>, bukan bukti mutlak. Celah waktu bisa juga terjadi karena kiosk
      memang sengaja dimatikan di luar jam sekolah (malam, akhir pekan, libur) — bukan berarti
      gangguan sungguhan. Tetap perlu penilaian manusia, terutama untuk kejadian di luar jam
      operasional sekolah.
    </div>
    <button class="btn-refresh" onclick="loadTab('sistem')">🔄 Reset Filter</button>
  `;
}

function buatGrafikSVG(timeline) {
  if (!timeline || !timeline.length) return `<div class="empty">Tidak ada data heartbeat tercatat pada rentang ini.</div>`;
  const w = 600, h = 110, padX = 3, baseY = h - 18;
  const maxVal = Math.max(1, ...timeline.map(t => t.jumlah));
  const barW = (w - padX * 2) / timeline.length;
  const bars = timeline.map((t, i) => {
    const kosong = t.jumlah === 0;
    const barH = kosong ? 3 : Math.max(3, (t.jumlah / maxVal) * (baseY - 10));
    const x = padX + i * barW;
    const y = baseY - barH;
    const judul = `${esc(new Date(t.waktu).toLocaleString('id-ID'))}: ${t.jumlah} heartbeat${kosong ? ' — tidak ada aktivitas' : ''}`;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1, barW - 1.2).toFixed(1)}" height="${barH.toFixed(1)}" rx="2"
      style="fill:${kosong ? 'var(--danger)' : 'var(--blue-dark)'}"><title>${judul}</title></rect>`;
  }).join('');
  const fmtOpt = { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' };
  const labelAwal = new Date(timeline[0].waktu).toLocaleString('id-ID', fmtOpt);
  const labelAkhir = new Date(timeline[timeline.length - 1].waktu).toLocaleString('id-ID', fmtOpt);
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;background:#fafcff;border-radius:8px">
      <line x1="${padX}" y1="${baseY}" x2="${w - padX}" y2="${baseY}" stroke="#e5e5e5" stroke-width="1"/>
      ${bars}
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:.62rem;color:var(--text-muted);margin-top:3px">
      <span>${esc(labelAwal)}</span><span>${esc(labelAkhir)}</span>
    </div>
    <div class="chart-legend">🟦 Ada aktivitas kiosk &nbsp;&nbsp; 🟥 Batang kosong = tidak ada heartbeat sama sekali di jendela waktu itu</div>
  `;
}

function renderGangguan(list) {
  if (!list || !list.length) return `<div class="empty">✅ Tidak ada celah waktu mencurigakan terdeteksi pada rentang ini.</div>`;
  return list.map(g => `
    <div class="list-item">
      <div class="avatar">🖥️</div>
      <div class="li-main">
        <div class="li-name">${esc(g.label)}</div>
        <div class="li-sub">${esc(new Date(g.mulai).toLocaleString('id-ID'))} → ${esc(new Date(g.selesai).toLocaleString('id-ID'))}</div>
      </div>
      <span class="badge badge-warning">⏳ ${g.durasiMenit} menit</span>
    </div>`).join('');
}

function renderInsiden(list) {
  if (!list || !list.length) return `<div class="empty">✅ Tidak ada insiden resmi tercatat dari Vercel/Supabase pada rentang ini.</div>`;
  return list.map(i => {
    const dampak = (i.dampak || 'none').toLowerCase();
    const cls = (dampak === 'critical' || dampak === 'major') ? 'badge-danger' : (dampak === 'minor' ? 'badge-warning' : 'badge-gray');
    return `
    <div class="list-item">
      <div class="avatar">☁️</div>
      <div class="li-main">
        <div class="li-name">${esc(i.judul)}</div>
        <div class="li-sub">${esc(i.sumber)} • ${esc(new Date(i.mulai).toLocaleString('id-ID'))} • ${esc(i.status)}</div>
      </div>
      <span class="badge ${cls}">${esc(dampak.toUpperCase())}</span>
    </div>`;
  }).join('');
}

init();
</script>
</body>
</html>
